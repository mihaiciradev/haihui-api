name: api-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: haihui_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENV: local
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/haihui_test
      SECRET_KEY: ci-test-secret-key
      CORS_ORIGINS: http://localhost:3000
      PUBLIC_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ruff
        run: ruff check app tests scripts

      - name: mypy
        run: mypy app

      - name: Enable citext extension
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d haihui_test \
            -c "CREATE EXTENSION IF NOT EXISTS citext;"

      - name: Run migrations
        run: alembic upgrade head

      - name: pytest
        run: pytest -q --cov=app --cov-report=term-missing

      - name: pip-audit
        run: pip-audit -r requirements.txt --strict
